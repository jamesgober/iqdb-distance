[package]
name    = "iqdb-distance"
version = "1.0.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.87"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "SIMD-accelerated distance and similarity functions for vector search - part of the iQDB family."

# Keywords (5 max)
keywords = [
    "simd",
    "distance",
    "vector-search",
    "similarity",
    "iqdb"
]

# Categories
categories = [
    "algorithms",
    "science"
]

# Links
homepage      = "https://github.com/jamesgober/iqdb-distance"
repository    = "https://github.com/jamesgober/iqdb-distance"
documentation = "https://docs.rs/iqdb-distance"

# Authors
authors = [
    "James Gober <me@jamesgober.com>",
    "Matt Callahan <matthewcallahan01@icloud.com>"
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "iqdb_distance"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
# Default build: scalar reference paths plus runtime-dispatched SIMD on
# supported targets. No optional dependencies.
default = []
# Exposes `force_scalar` (the sticky global override that pins every dispatched
# distance call onto the scalar reference path) and `which_kernel` (the kernel
# the dispatcher would route to right now). Used by the differential SIMD
# correctness test and the criterion benches to exercise the scalar path on a
# host that would otherwise pick a SIMD kernel. A production build without this
# feature cannot reach the override.
testing = []


# DEPENDENCIES
# #################################
[dependencies]
# Shared public vocabulary: DistanceMetric, IqdbError, Result.
iqdb-types = "1.0.0"


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
# Per-metric scalar-vs-SIMD micro-benches and headroom tracking.
criterion = { version = "0.5", features = ["html_reports"] }
# Property tests for the math invariants (symmetry, identity, bounds).
proptest  = "1"


# BENCHMARKS
# #################################
[[bench]]
name    = "distance"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
